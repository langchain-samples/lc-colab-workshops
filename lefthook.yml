# Git hooks for this repo. Install them once with:
#
#     uv sync --group dev && uv run lefthook install
#
# Skip a hook for one commit with `git commit --no-verify` (do this rarely, and
# never for the secret scan).

pre-commit:
  parallel: false # strip runs before lint; lint reads what strip produced
  jobs:
    # Notebook outputs are never committed: they bloat diffs and can carry
    # tunnel URLs, workspace IDs, and traced payloads.
    # `uv run` because nbstripout lives in .venv, not on PATH. --no-sync keeps
    # every commit from re-resolving the lockfile.
    # Do not drop --keep-metadata-keys: `cellView: form` is what makes the bulk
    # data cells collapse in Colab, and losing it silently unfolds them.
    - name: strip notebook outputs
      glob: "notebooks/*.ipynb"
      run: uv run --no-sync nbstripout --keep-metadata-keys cellView {staged_files}
      stage_fixed: true # re-stage whatever was rewritten

    # Check, not --fix: these notebooks are generated from scripts in scratch/, and
    # silently rewriting the .ipynb would desync it from its generator. Run
    # `uv run ruff check --fix notebooks/` yourself and port the change to both.
    - name: ruff
      glob: "notebooks/*.ipynb"
      run: uv run --no-sync ruff check {staged_files}

    # Checks the whole notebooks/ dir rather than {staged_files}: a call in one
    # notebook can break because a fixture in another changed.
    - name: ty
      glob: "notebooks/*.ipynb"
      run: uv run --no-sync ty check notebooks/

    - name: lint notebooks
      glob: "notebooks/*.ipynb"
      run: python3 tools/check_notebooks.py

    - name: scan for secrets
      run: bash tools/scan_secrets.sh {staged_files}

pre-push:
  jobs:
    # The pre-commit lint only fires when a notebook changed. This one always
    # runs, so a change to tools/ or a bad merge cannot slip through.
    - name: lint all notebooks
      run: python3 tools/check_notebooks.py
