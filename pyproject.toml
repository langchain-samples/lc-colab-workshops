[project]
name = "lc-colab-workshops"
version = "0.1.0"
description = "Hands-on Colab notebooks for building agents with Deep Agents and evaluating them with LangSmith"
requires-python = ">=3.11"  # deepagents requires 3.11+; Colab is well past it

# Intentionally empty. The notebooks install their own pinned dependencies in
# their setup cell so that each one is self-contained in Colab (see CONTRIBUTING.md).
# Nothing here is needed to *run* a lesson.
dependencies = []

[dependency-groups]
dev = [
    "lefthook>=2.1.10",   # git hook manager; installs the hooks in .git/hooks
    "nbstripout>=0.9.1",  # clears notebook outputs before commit
    "ruff>=0.16.3",       # lints notebooks directly; understands cells and magics
    "ty>=0.0.72",         # type-checks notebooks; catches wrong kwargs before a workshop does
    # ty can only check calls whose libraries it can see, so the notebook stack is a dev
    # dependency even though no notebook imports anything from this project. ~110 MB.
    "deepagents~=0.7.6",
    "langchain~=1.3.15",
    "langchain-openai~=1.5.1",
    "langsmith~=0.11.0",
    "langchain-mcp-adapters~=0.3.2",
    "openevals~=0.2.0",
    "agentevals~=0.0.9",
]

[tool.uv]
# This repo is a collection of notebooks, not an installable package.
package = false

[tool.ruff]
# Ruff reads .ipynb natively and treats each notebook as one namespace across its
# cells, so a name defined in cell 3 and used in cell 9 is not a false positive.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow. These notebooks are read as exemplary code by workshop
# participants, so the rules worth enforcing are the ones about dead and broken
# code — not stylistic opinions that would fight the teaching narrative.
select = [
    "F",   # pyflakes: unused imports, undefined names, f-string mistakes
    "E4",  # import placement
    "E7",  # statement-level mistakes
    "E9",  # syntax and IO errors
    "I",   # import sorting
    "C4",  # comprehension/literal simplifications
]
ignore = [
    # `str(x)` inside an f-string is clearer to a learner than the `!s` conversion
    # flag, which reads as line noise to anyone who has not met it before.
    "RUF010",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = [
    # Lessons deliberately catch broad exceptions: 00_setup reports a failed
    # preflight check rather than dumping a traceback at a workshop participant,
    # and several lessons demo what happens when a tool raises.
    "BLE001",
    "S110",
]

[tool.ty.rules]
# Everything not listed here stays on. These three are off because each fires on
# code that is correct, and a checker that cries wolf gets muted.

# `from google.colab import userdata` appears in all 15 setup cells and cannot
# resolve outside Colab. Keeping this rule on would mean 15 permanent errors.
unresolved-import = "ignore"

# Fires ~36 times on dict literals passed where a TypedDict is expected —
# `subagents=[researcher]`, `config={"configurable": ...}` — which is the
# documented API and verified working.
invalid-argument-type = "ignore"

# `create_agent` has complex overloads; lesson 09's hand-built stack does not
# match any of them statically but runs correctly.
no-matching-overload = "ignore"
